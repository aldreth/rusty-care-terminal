# Dependabot keeps Cargo + Actions deps current. Merge its PRs manually
# (Mergify from Orhun's 2023 blog is skipped). `chore(deps)` commits are
# left out of the changelog by cliff.toml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
