# Opens/updates a Release PR and, after it merges, publishes + tags.
# Tag push triggers dist's release.yml for binary GitHub Releases.
#
# Required repo settings (GitHub → Settings):
#   Actions → General → Workflow permissions: allow creating/approving PRs
#
# Required secrets:
#   RELEASE_PLZ_TOKEN   — fine-grained PAT (contents + pull requests: read/write)
#                         so tags/PRs can trigger other workflows (dist + CI).
#                         Falls back to GITHUB_TOKEN (tags then won't trigger dist).
#   CARGO_REGISTRY_TOKEN — crates.io token with publish-new + publish-update
#                         (or configure crates.io trusted publishing + id-token).
#
# Based on https://release-plz.dev/docs/github/quickstart and
# https://blog.orhun.dev/automated-rust-releases/ (2023; action path updated).

name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'aldreth' }}
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'aldreth' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
