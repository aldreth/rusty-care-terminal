# release-plz + dist (+ git-cliff) — Orhun's 2023 stack, updated for 2026.
# Flow: merge to main → release-plz opens/updates a Release PR → merge that PR →
# release-plz tags vX.Y.Z (+ optional crates.io publish) → dist builds binaries
# and creates the GitHub Release.
#
# Docs: https://release-plz.dev/docs/config
#       https://release-plz.dev/docs/extra/releasing-binaries

[workspace]
# Path of the git-cliff configuration
changelog_config = "cliff.toml"

# Enable changelog updates in the Release PR
changelog_update = true

# Run `cargo update` before each release PR
dependencies_update = true

# Create tags for releases (triggers dist's release.yml)
git_tag_enable = true

# Single-crate tag format matches dist's unified announcement (v0.1.0)
git_tag_name = "v{{ version }}"

# Let dist create the GitHub Release (with installers / archives)
git_release_enable = false

# Labels for the release PR
pr_labels = ["release"]

# Disallow updating / packaging with uncommitted changes
allow_dirty = false
publish_allow_dirty = false

# Binary TUI: skip cargo-semver-checks (no public library API to check)
semver_check = false

# Publish to crates.io when CARGO_REGISTRY_TOKEN (or trusted publishing) is set.
# First crates.io publish of a new crate must be done manually once if using
# trusted publishing; a classic CARGO_REGISTRY_TOKEN works for the first publish.
publish = false
