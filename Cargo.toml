[package]
name = "rusty-care-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A gentle Rust + ratatui care terminal inspired by tiny-care-terminal, with Mastodon RSS care feeds"
license = "MIT"
readme = "README.md"
repository = "https://github.com/aldreth/rusty-care-terminal"
homepage = "https://github.com/aldreth/rusty-care-terminal"
keywords = ["tui", "ratatui", "mastodon", "git", "pomodoro"]
categories = ["command-line-utilities"]
include = ["/src", "/fixtures", "/README.md", "/CONFIGURATION.md", "/CHANGELOG.md", "/LICENSE"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
feed-rs = "3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
